name: CI - Verificación de Soluciones Python vs Java

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-python:
    name: Pruebas en Python
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias de Python
        run: |
          python -m unittest discover -s python -v

      - name: Probar ejecución con entrada simulada (10 invitados)
        run: |
          echo "10" | python python/calculador_presupuesto.py

  test-java:
    name: Pruebas en Java 21+
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Ejecutar pruebas unitarias de Java
        run: |
          java --enable-preview --source 21 java/TestCalculadorPresupuesto.java

      - name: Probar ejecución con entrada simulada (10 invitados)
        run: |
          echo "10" | java --enable-preview --source 21 java/CalculadorPresupuesto.java
